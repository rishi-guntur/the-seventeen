name: Deploy site to GitHub Pages

# Builds the static site (scripts/build_site.py) and publishes it to GitHub Pages.
on:
  push:
    branches: [main, "claude/bold-sagan-sag85p"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of this workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install markdown openpyxl
      - name: Build the model
        run: python scripts/build_model.py
      - name: Build the site
        run: python scripts/build_site.py --out site
      - uses: actions/configure-pages@v5
        with:
          # Best-effort: enable Pages automatically on first run so no manual
          # toggle is needed. If the token lacks permission, enable it once via
          # Settings -> Pages -> Source: GitHub Actions.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
